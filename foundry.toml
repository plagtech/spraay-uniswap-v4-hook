[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
bytecode_hash = "none"
optimizer = true
optimizer_runs = 1000

[rpc_endpoints]
base = "${BASE_RPC_URL}"
bsc = "${BSC_RPC_URL}"

[etherscan]
base = { key = "${ETHERSCAN_API_KEY}", chain = 8453 }
bsc = { key = "${ETHERSCAN_API_KEY}", chain = 56 }

[lint]
exclude_lints = ["screaming-snake-case-immutable", "screaming-snake-case-const"]
lint_on_build = false

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
